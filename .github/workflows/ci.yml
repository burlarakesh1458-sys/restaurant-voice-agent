name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      # Fully offline: rule-based fake LLM, fake ASR, fake TTS. No API keys in CI.
      - run: pytest -q
      - name: Scenario suite with the no-LLM baseline (offline)
        run: python -m scripts.run_eval --llm rules --tts fake --tag ci --fresh
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t trattoria-voice-agent .
